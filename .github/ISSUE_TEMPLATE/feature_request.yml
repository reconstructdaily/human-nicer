name: Idea or request
description: Suggest something Human-nicer should do
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you're in, not the solution — e.g. "I write in Slack all day and…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
