name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't paste private text** — describe it or use a made-up example.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Example text (optional)
      description: A made-up sample that reproduces it, e.g. text that got a surprising score.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
